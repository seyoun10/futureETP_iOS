# 커밋 전 검사(scripts/check.sh)를 push·PR마다 다시 돌린다.
# 계약 예시·문구 카탈로그 검사가 원본 저장소를 읽으므로 futureETP main을 함께 받는다.
# 로컬에서 ../futureETP 최신을 보는 것과 같아서, 원본이 바뀌어 여기가 실패하면 "원본 변경 반영" 대상이다.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Xcode 27 GA 이미지(macOS 27, arm64). 기본 Xcode는 27.1이라 로컬과 같은 27.2를 고른다
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      FUTUREETP_DIR: ${{ github.workspace }}/futureETP
    steps:
      - uses: actions/checkout@v7
        with:
          path: ios
      - uses: actions/checkout@v7
        with:
          repository: seyoun10/futureETP
          path: futureETP
      - uses: actions/setup-node@v7
        with:
          node-version-file: futureETP/.nvmrc
      # 검사 스크립트가 쓰는 건 packages/shared의 zod뿐이다
      - run: npm ci --workspace packages/shared --include-workspace-root=false --ignore-scripts
        working-directory: futureETP
      - uses: jdx/mise-action@v5
        with:
          working_directory: ios
      - run: xcodebuild -version && xcrun simctl list devices available 'iPhone 18 Pro'
      - run: ./scripts/check.sh
        working-directory: ios
